<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Demo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1 {
    text-align: center;
}

.panel {
    background: #1f2937;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
}

input, button {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border-radius: 8px;
    border: 0;
    font-size: 16px;
}

input {
    background: #374151;
    color: white;
}

button {
    background: #2563eb;
    color: white;
    font-weight: bold;
}

button.remove {
    background: #dc2626;
}

.item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #374151;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
}

.item-info {
    flex: 1;
}

.item-id {
    font-size: 12px;
    color: #9ca3af;
}

.quantity {
    font-weight: bold;
    margin-right: 10px;
}

.actions {
    display: flex;
    gap: 5px;
}

.actions button {
    width: auto;
    margin: 0;
    padding: 8px 12px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎒 Inventory Demo</h1>

<div class="panel">

<h3>➕ Add Item</h3>

<input id="itemId"
       placeholder="Item ID, ví dụ: christmas_sword">

<input id="itemName"
       placeholder="Tên vật phẩm">

<input id="itemQuantity"
       type="number"
       min="1"
       value="1">

<button onclick="addItem()">ADD ITEM</button>

</div>

<div class="panel">

<h3>📦 Inventory</h3>

<div id="inventory"></div>

</div>

<div class="panel">

<button onclick="saveInventory()">
💾 Save
</button>

<button onclick="loadInventory()">
📂 Load
</button>

<button class="remove" onclick="clearInventory()">
🗑️ Clear Inventory
</button>

</div>

</div>

<script>

let inventory = [];

/* Thêm vật phẩm */
function addItem() {

    const id = document.getElementById("itemId").value.trim();
    const name = document.getElementById("itemName").value.trim();
    const quantity = parseInt(
        document.getElementById("itemQuantity").value
    );

    if (!id || !name || quantity <= 0) {
        alert("Hãy nhập đầy đủ thông tin.");
        return;
    }

    const existing = inventory.find(item => item.id === id);

    if (existing) {
        existing.quantity += quantity;
    } else {
        inventory.push({
            id: id,
            name: name,
            quantity: quantity
        });
    }

    renderInventory();

    document.getElementById("itemId").value = "";
    document.getElementById("itemName").value = "";
    document.getElementById("itemQuantity").value = 1;
}


/* Hiển thị inventory */
function renderInventory() {

    const container = document.getElementById("inventory");

    container.innerHTML = "";

    if (inventory.length === 0) {
        container.innerHTML =
            "<p>Inventory đang trống.</p>";
        return;
    }

    inventory.forEach((item, index) => {

        const element = document.createElement("div");

        element.className = "item";

        element.innerHTML = `
            <div class="item-info">
                <strong>${escapeHtml(item.name)}</strong>
                <div class="item-id">
                    ID: ${escapeHtml(item.id)}
                </div>
            </div>

            <span class="quantity">
                x${item.quantity}
            </span>

            <div class="actions">
                <button onclick="increaseItem(${index})">
                    +
                </button>

                <button class="remove"
                        onclick="removeItem(${index})">
                    -
                </button>
            </div>
        `;

        container.appendChild(element);
    });
}


/* +1 */
function increaseItem(index) {

    inventory[index].quantity++;

    renderInventory();
}


/* -1 */
function removeItem(index) {

    inventory[index].quantity--;

    if (inventory[index].quantity <= 0) {
        inventory.splice(index, 1);
    }

    renderInventory();
}


/* Lưu vào điện thoại */
function saveInventory() {

    localStorage.setItem(
        "inventory_demo",
        JSON.stringify(inventory)
    );

    alert("Đã lưu inventory.");
}


/* Đọc dữ liệu */
function loadInventory() {

    const data =
        localStorage.getItem("inventory_demo");

    if (data) {
        inventory = JSON.parse(data);
        renderInventory();
    }
}


/* Xóa toàn bộ */
function clearInventory() {

    if (!confirm("Xóa toàn bộ inventory?")) {
        return;
    }

    inventory = [];

    localStorage.removeItem("inventory_demo");

    renderInventory();
}


/* Chống chèn HTML */
function escapeHtml(text) {

    return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


renderInventory();

</script>

</body>
</html>
